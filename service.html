<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirection — TKN Technics</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <script>
    // Anciennes URLs service.html?s=<slug> → nouvelles pages statiques.
    (function () {
      var map = {
        nettoyage: "service-nettoyage-industriel.html",
        maintenance: "service-maintenance-generale.html",
        interventions: "service-interventions-specialisees.html",
        espaces: "service-espaces-verts.html"
      };
      var slug = "";
      try { slug = new URLSearchParams(window.location.search).get("s") || ""; } catch (e) {}
      window.location.replace(map[slug] || "index.html#services");
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=index.html#services" />
</head>
<body>
  <p style="font-family:sans-serif;padding:24px">Redirection en cours… <a href="index.html#services">Voir nos services</a></p>
</body>
</html>
